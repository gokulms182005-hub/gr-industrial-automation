<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0f2138"/>
    <stop offset="100%" stop-color="#060d18"/>
  </linearGradient>
  <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1e3a5f"/>
    <stop offset="100%" stop-color="#0f2138"/>
  </linearGradient>
</defs>
<rect width="900" height="700" fill="url(#bg2)"/>
<g opacity="0.12" stroke="#22d3ee">
  <line x1="0" y1="150" x2="900" y2="150"/><line x1="0" y1="300" x2="900" y2="300"/>
  <line x1="0" y1="450" x2="900" y2="450"/><line x1="0" y1="600" x2="900" y2="600"/>
  <line x1="225" y1="0" x2="225" y2="700"/><line x1="450" y1="0" x2="450" y2="700"/><line x1="675" y1="0" x2="675" y2="700"/>
</g>
<!-- three control cabinets -->
<g>
  <rect x="140" y="180" width="180" height="420" rx="8" fill="url(#cab)" stroke="#2f8fff" stroke-width="2"/>
  <rect x="360" y="130" width="180" height="470" rx="8" fill="url(#cab)" stroke="#22d3ee" stroke-width="2"/>
  <rect x="580" y="200" width="180" height="400" rx="8" fill="url(#cab)" stroke="#2f8fff" stroke-width="2"/>
</g>
<!-- cabinet 1 details: breakers -->
<g fill="#0a1626" stroke="#5c6b82" stroke-width="1.5">
  <rect x="165" y="210" width="50" height="26"/><rect x="225" y="210" width="50" height="26"/>
  <rect x="165" y="246" width="50" height="26"/><rect x="225" y="246" width="50" height="26"/>
  <rect x="165" y="282" width="50" height="26"/><rect x="225" y="282" width="50" height="26"/>
</g>
<g fill="#33d17a"><circle cx="180" cy="223" r="4"/><circle cx="240" cy="223" r="4"/><circle cx="180" cy="259" r="4"/></g>
<g fill="#ffb020"><circle cx="240" cy="259" r="4"/></g>
<rect x="165" y="330" width="110" height="16" rx="3" fill="#0a1626" stroke="#22d3ee" stroke-width="1.2"/>
<rect x="165" y="360" width="110" height="16" rx="3" fill="#0a1626" stroke="#22d3ee" stroke-width="1.2"/>
<!-- cabinet 2: HMI + meters -->
<rect x="385" y="165" width="130" height="90" rx="6" fill="#060d18" stroke="#22d3ee" stroke-width="1.5"/>
<polyline points="395,235 415,210 435,225 455,190 475,215 495,205" fill="none" stroke="#22d3ee" stroke-width="2.5"/>
<circle cx="450" cy="320" r="34" fill="#0a1626" stroke="#2f8fff" stroke-width="2.5"/>
<line x1="450" y1="320" x2="465" y2="300" stroke="#22d3ee" stroke-width="2.5"/>
<g fill="#5c6b82"><rect x="400" y="380" width="100" height="10" rx="3"/><rect x="400" y="400" width="70" height="10" rx="3"/></g>
<!-- cabinet 3: terminal wiring -->
<g stroke="#90a0b7" stroke-width="1.5" fill="none">
  <line x1="605" y1="240" x2="735" y2="240"/><line x1="605" y1="260" x2="735" y2="260"/>
  <line x1="605" y1="280" x2="735" y2="280"/><line x1="605" y1="300" x2="735" y2="300"/>
</g>
<g fill="#2f8fff"><circle cx="620" cy="240" r="4"/><circle cx="660" cy="260" r="4"/><circle cx="700" cy="280" r="4"/><circle cx="640" cy="300" r="4"/></g>
<rect x="605" y="340" width="130" height="70" rx="6" fill="#0a1626" stroke="#5c6b82" stroke-width="1.5"/>
<line x1="620" y1="360" x2="720" y2="360" stroke="#90a0b7" stroke-width="2"/>
<line x1="620" y1="378" x2="700" y2="378" stroke="#90a0b7" stroke-width="2"/>
<line x1="620" y1="396" x2="680" y2="396" stroke="#90a0b7" stroke-width="2"/>
<!-- floor line -->
<line x1="0" y1="640" x2="900" y2="640" stroke="#1e3a5f" stroke-width="2"/>
</svg>
