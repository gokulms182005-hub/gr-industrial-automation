<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="g4" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f2138"/><stop offset="100%" stop-color="#060d18"/></linearGradient>
<linearGradient id="silo" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#0f2138"/></linearGradient></defs>
<rect width="800" height="600" fill="url(#g4)"/>
<g opacity="0.12" stroke="#22d3ee"><line x1="0" y1="150" x2="800" y2="150"/><line x1="0" y1="300" x2="800" y2="300"/><line x1="0" y1="450" x2="800" y2="450"/></g>
<!-- silos -->
<rect x="90" y="220" width="110" height="260" rx="55" fill="url(#silo)" stroke="#2f8fff" stroke-width="2"/>
<rect x="220" y="180" width="130" height="300" rx="65" fill="url(#silo)" stroke="#22d3ee" stroke-width="2"/>
<!-- kiln cylinder -->
<rect x="400" y="330" width="300" height="60" rx="30" fill="#132846" stroke="#2f8fff" stroke-width="2.5"/>
<g stroke="#5c6b82" stroke-width="1.5"><line x1="440" y1="330" x2="440" y2="390"/><line x1="500" y1="330" x2="500" y2="390"/><line x1="560" y1="330" x2="560" y2="390"/><line x1="620" y1="330" x2="620" y2="390"/></g>
<!-- energy gauge -->
<g transform="translate(600,220)">
  <circle r="60" fill="#0a1626" stroke="#2f8fff" stroke-width="4"/>
  <path d="M -42 20 A 45 45 0 1 1 42 20" fill="none" stroke="#1e3a5f" stroke-width="8"/>
  <path d="M -42 20 A 45 45 0 0 1 20 -38" fill="none" stroke="#22d3ee" stroke-width="8"/>
  <line x1="0" y1="0" x2="18" y2="-32" stroke="#ffb020" stroke-width="3"/>
  <circle r="5" fill="#ffb020"/>
</g>
<text x="600" y="300" text-anchor="middle" fill="#90a0b7" font-family="monospace" font-size="14">kWh</text>
<!-- base line -->
<line x1="0" y1="480" x2="800" y2="480" stroke="#1e3a5f" stroke-width="2"/>
<g fill="#2f8fff" opacity="0.6"><circle cx="130" cy="240" r="4"/><circle cx="270" cy="200" r="4"/></g>
</svg>
