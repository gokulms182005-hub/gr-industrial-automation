<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="g3" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#11233d"/><stop offset="100%" stop-color="#060d18"/></linearGradient>
