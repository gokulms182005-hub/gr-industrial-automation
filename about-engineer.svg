  <circle cx="570" cy="230" r="4"/><circle cx="620" cy="190" r="4"/>
</g>
<g fill="#5c6b82"><rect x="270" y="400" width="80" height="10" rx="4"/><rect x="270" y="420" width="140" height="10" rx="4"/></g>
<g fill="#33d17a"><circle cx="640" cy="405" r="6"/></g>
<g fill="#ffb020"><circle cx="600" cy="150" r="5"/></g>
