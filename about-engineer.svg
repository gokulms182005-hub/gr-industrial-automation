<svg viewBox="0 0 900 700" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#11233d"/>
    <stop offset="100%" stop-color="#0a1626"/>
  </linearGradient>
  <linearGradient id="panel1" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1e3a5f"/>
    <stop offset="100%" stop-color="#132846"/>
  </linearGradient>
</defs>
<rect width="900" height="700" fill="url(#bg1)"/>
<g opacity="0.15" stroke="#22d3ee">
