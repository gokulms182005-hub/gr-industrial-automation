  <line x1="450" y1="0" x2="450" y2="700"/><line x1="600" y1="0" x2="600" y2="700"/><line x1="750" y1="0" x2="750" y2="700"/>
</g>
<!-- control panel / HMI screen -->
<rect x="220" y="140" width="460" height="320" rx="14" fill="url(#panel1)" stroke="#2f8fff" stroke-width="2"/>
