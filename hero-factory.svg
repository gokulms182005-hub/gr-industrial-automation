<svg viewBox="0 0 1800 900" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0a1626"/>
    <stop offset="100%" stop-color="#050b15"/>
  </linearGradient>
  <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#16304f"/>
    <stop offset="100%" stop-color="#0d1f36"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
  </radialGradient>
</defs>
<rect width="1800" height="900" fill="url(#sky)"/>
<g opacity="0.18" stroke="#22d3ee" stroke-width="1">
  <path d="M0 0 L1800 900 M1800 0 L0 900" />
  <circle cx="900" cy="450" r="380" fill="none"/>
  <circle cx="900" cy="450" r="260" fill="none"/>
</g>
<circle cx="1400" cy="220" r="260" fill="url(#glow)"/>
<!-- factory buildings skyline -->
<g>
  <rect x="60" y="520" width="140" height="330" fill="url(#bld)"/>
  <rect x="220" y="440" width="90" height="410" fill="url(#bld)"/>
  <rect x="330" y="560" width="180" height="290" fill="url(#bld)"/>
  <rect x="540" y="380" width="120" height="470" fill="url(#bld)"/>
  <rect x="690" y="480" width="240" height="370" fill="url(#bld)"/>
  <rect x="960" y="340" width="100" height="510" fill="url(#bld)"/>
  <rect x="1090" y="500" width="200" height="350" fill="url(#bld)"/>
  <rect x="1320" y="420" width="130" height="430" fill="url(#bld)"/>
  <rect x="1480" y="560" width="260" height="290" fill="url(#bld)"/>
  <!-- smokestacks -->
  <rect x="255" y="360" width="20" height="90" fill="#0d1f36"/>
  <rect x="1000" y="270" width="20" height="90" fill="#0d1f36"/>
  <!-- windows grid glow -->
  <g fill="#2f8fff" opacity="0.55">
    <rect x="80" y="550" width="14" height="20"/><rect x="110" y="550" width="14" height="20"/><rect x="140" y="550" width="14" height="20"/>
    <rect x="80" y="600" width="14" height="20"/><rect x="110" y="600" width="14" height="20"/><rect x="140" y="600" width="14" height="20"/>
    <rect x="710" y="520" width="14" height="20"/><rect x="745" y="520" width="14" height="20"/><rect x="780" y="520" width="14" height="20"/><rect x="815" y="520" width="14" height="20"/>
    <rect x="710" y="570" width="14" height="20"/><rect x="745" y="570" width="14" height="20"/><rect x="780" y="570" width="14" height="20"/><rect x="815" y="570" width="14" height="20"/>
    <rect x="1120" y="540" width="14" height="20"/><rect x="1155" y="540" width="14" height="20"/><rect x="1190" y="540" width="14" height="20"/>
    <rect x="1120" y="590" width="14" height="20"/><rect x="1155" y="590" width="14" height="20"/><rect x="1190" y="590" width="14" height="20"/>
    <rect x="1510" y="600" width="14" height="20"/><rect x="1545" y="600" width="14" height="20"/><rect x="1580" y="600" width="14" height="20"/><rect x="1615" y="600" width="14" height="20"/>
    <rect x="1510" y="650" width="14" height="20"/><rect x="1545" y="650" width="14" height="20"/><rect x="1580" y="650" width="14" height="20"/><rect x="1615" y="650" width="14" height="20"/>
  </g>
  <circle cx="265" cy="350" r="5" fill="#22d3ee"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="1010" cy="260" r="5" fill="#22d3ee"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
</g>
<!-- foreground conveyor line -->
<g stroke="#1e3a5f" stroke-width="2">
  <line x1="0" y1="850" x2="1800" y2="850"/>
</g>
<g fill="#2f8fff">
  <circle cx="120" cy="850" r="7"/><circle cx="240" cy="850" r="7"/><circle cx="360" cy="850" r="7"/>
  <circle cx="480" cy="850" r="7"/><circle cx="600" cy="850" r="7"/><circle cx="720" cy="850" r="7"/>
</g>
</svg>
